const pic=(n,alt,sz,eager)=>`<img src="img/${n}.webp" srcset="img/${n}-480.webp 480w, img/${n}.webp 900w" sizes="${sz}" alt="${esc(alt)}" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async" style="background:url(${LQ[n]}) center/cover">`;
const IMG={umgidi:"ceremony",umsebenzi:"cooking",intonjane:"blankets",umbhaco:"decor",umcimbi:"ceremony",memorial:"cooking",other:"decor"};
function card(e,f){const d=new Date(e.date+"T00:00");return `<article class="card t-${e.type}${f?" feat":""}"><div class="ph">${pic(IMG[e.type]||"decor","","(min-width:800px) 33vw, 100vw")}<div class="dt">${d.getDate()}<span>${d.toLocaleDateString("en-ZA",{month:"short"})}</span></div></div><div class="bd"><span class="chip">${esc(TYPES[e.type]||e.type)}</span><h3><a href="#event/${e.id}" style="color:inherit">${esc(e.title)}</a></h3><p class="meta">${fmt(e.date)} at ${esc(e.start)}</p><p class="meta">${esc(e.town)}, ${esc(e.prov)}${e.km!=null?` · <span class="dist">${Math.round(e.km)} ${L("km")}</span>`:""}</p></div></article>`}
function adCard(){return `<aside class="ad" aria-label="${L("sponsored")}"><small>${L("sponsored")}</small><strong style="font:800 20px Fraunces,serif">${L("ad_h")}</strong><span>${L("ad_p")}</span></aside>`}
function cards(r,max){const out=[];r.slice(0,max||r.length).forEach((e,i)=>{out.push(card(e,i===0));if((i+1)%5===0)out.push(adCard())});return out.join("")}
function locate(){
 if(!navigator.geolocation){st.locState="denied";render();return}
 st.locState="asking";render();
 navigator.geolocation.getCurrentPosition(p=>{setLoc("Your location",p.coords.latitude,p.coords.longitude)},()=>{st.locState="denied";render()},{timeout:10000,maximumAge:600000});
}
function locMsg(){
 if(st.locState==="asking")return `<p class="meta" role="status">${L("locating")}</p>`;
 if(st.locState==="ok")return `<p class="meta" role="status">${L("loc_ok")}</p>`;
 if(st.locState==="denied"||st.locState==="manual"&&!st.loc)return townPicker();
 return `<div class="banner"><span>Set your location to see events nearest to you.</span><button class="btn" id="banset">Set location</button></div>`}
function townPicker(){return `<div class="field" style="max-width:420px"><p class="meta">${L("loc_no")}</p><label for="tw">${L("town")}</label><div style="display:flex;gap:.5rem"><input id="tw" list="towns" autocomplete="off"><button class="btn" id="settown">${L("set_town")}</button></div><datalist id="towns">${Object.keys(TOWNS).map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>`}
function bindTown(){const b=document.getElementById("settown");if(b)b.onclick=()=>{const v=document.getElementById("tw").value.trim(),t=TOWNS[v];if(t){setLoc(v,t[0],t[1])}else toast(L("need_town"))}}

// ---------- Views ----------
function home(){
 const r=list(),near=st.loc?L("near_h"):L("all_h");
 return `<section class="hero"><div><h1>${L("hero_h")}</h1><p class="lead">${L("hero_p")}</p>
 <form class="search" role="search" id="sf"><label class="sr" for="q">${L("search")}</label><input id="q" placeholder="${L("search_ph")}"><button class="btn blue" type="submit">${L("search")}</button><button class="btn pri" type="button" id="nearbtn">${L("near")}</button></form>${locMsg()}</div><figure class="hfig">${pic("ceremony","A woman in traditional attire serving at a family gathering","(min-width:800px) 58vw, 100vw",1)}<figcaption>Umcimbi, Eastern Cape</figcaption></figure></section>
 ${band()}<section><h2>${near}</h2>${r.length?`<div class="grid">${cards(r,6)}</div><p><a class="btn" href="#events">${L("nav_events")}</a></p>`:`<p>${EVENTS.length?L("none"):L("empty")}</p><a class="btn pri" href="#post">${L("cta_b")}</a>`}</section>
 ${band()}<section><h2>${L("brands_h")}</h2><p class="meta">${L("brands_p")}</p><div class="brands">${BRANDS.map(b=>`<span class="brand-chip">${b}</span>`).join("")}</div></section>
 ${band()}<section><h2>${L("gal_h")}</h2>${galGrid(3)}<p><a class="btn" href="#gallery">Open gallery</a></p></section>
 <section class="cta"><h2>${L("cta_h")}</h2><p>${L("cta_p")}</p><a class="btn pri" href="#post" style="width:fit-content">${L("cta_b")}</a></section>`}
function events(){
 const r=list(),sel=(id,lab,opts,v)=>`<div><label for="${id}">${lab}</label><select id="${id}"><option value="">${L("f_any")}</option>${opts.map(o=>`<option value="${o[0]}"${String(o[0])===String(v)?" selected":""}>${esc(o[1])}</option>`).join("")}</select></div>`;
 let body;
 if(st.view==="map"){body=mapView(r)}else{body=r.length?`<div class="grid">${cards(r)}</div>`:`<p>${EVENTS.length?L("none"):L("empty")}</p><a class="btn pri" href="#post">${L("cta_b")}</a>`}
 return `<h1 style="margin-top:1.5rem">Imicimbi</h1>${locMsg()}<button class="btn pri" id="nearbtn">${L("near")}</button>
 <div class="filters">${sel("ft",L("f_type"),Object.entries(TYPES),st.type)}${sel("fp",L("f_prov"),PROV.map(p=>[p,p]),st.prov)}${st.loc?sel("fd",L("f_dist"),[10,25,50,100].map(d=>[d,d+" km"]),st.dist):""}</div>
 <div class="tabs"><button data-tab="up" aria-pressed="${st.tab==="up"}">${L("upcoming")}</button><button data-tab="past" aria-pressed="${st.tab==="past"}">${L("past")}</button><span style="flex:1"></span><button data-view="list" aria-pressed="${st.view==="list"}">${L("list")}</button><button data-view="map" aria-pressed="${st.view==="map"}">${L("map")}</button></div>${body}`}
function mapView(r){
 const la=[-35,-25],lo=[17,32],W=640,H=420,px=(a,b)=>[(b-lo[0])/(lo[1]-lo[0])*W,(la[1]-a)/(la[1]-la[0])*H];
 const dots=r.map(e=>{const[x,y]=px(e.lat,e.lng);return `<a href="#event/${e.id}"><circle cx="${x}" cy="${y}" r="9" fill="#D9731F" stroke="#1A1412" stroke-width="2"><title>${esc(e.title)}</title></circle></a>`}).join("");
 const me=st.loc?(()=>{const[x,y]=px(st.loc[0],st.loc[1]);return `<circle cx="${x}" cy="${y}" r="7" fill="#1E4D9B" stroke="#fff" stroke-width="3"/>`})():"";
 const lab=Object.entries(TOWNS).filter((_,i)=>i%3===0).map(([n,t])=>{const[x,y]=px(t[0],t[1]);return `<text x="${x+10}" y="${y+4}" font-size="11" fill="var(--muted)">${esc(n)}</text>`}).join("");
 return `<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Map of event locations"><rect width="${W}" height="${H}" fill="var(--bg)"/>${lab}${dots}${me}</svg></div><p class="hint">Simple offline map. Full OpenStreetMap map arrives with the Leaflet step.</p>`}
function detail(id){
 const e=EVENTS.find(x=>x.id===id);if(!e)return `<p>${L("none")}</p>`;
 const km=st.loc?Math.round(hav(st.loc[0],st.loc[1],e.lat,e.lng)):null;
 const wa=`https://wa.me/${esc(String(e.phone).replace(/\D/g,""))}?text=${encodeURIComponent("Hi, I’m asking about "+e.title+" on KwaXhosa")}`;
 return `<p><a href="#events">${L("back")}</a></p><article class="card t-${e.type}" style="margin-top:.5rem"><span class="chip">${esc(TYPES[e.type]||e.type)}</span><h1>${esc(e.title)}</h1><p><strong>${fmt(e.date)}</strong> at ${esc(e.start)}${e.end?"–"+esc(e.end):""}</p><p>${esc(e.town)}, ${esc(e.prov)}${km!=null?` · <span class="dist">${km} ${L("km")}</span>`:""}</p><p>${esc(e.desc)}</p>${e.host?`<p class="meta">${L("host")} ${esc(e.host)}</p>`:""}<h3>${L("directions")}</h3><p>${esc(e.dir||"")}</p>
 <div style="display:flex;gap:.5rem;flex-wrap:wrap"><a class="btn pri" href="${wa}" rel="noopener" target="_blank">${L("whatsapp")}</a><a class="btn" rel="noopener" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}">Get directions</a><button class="btn" id="cp">${L("copy")}</button></div></article>${adCard()}`}
function post(){
 const f=(id,lab,inner,h)=>`<div class="field"><label for="${id}">${lab}</label>${inner}${h?`<p class="hint">${h}</p>`:""}<p class="err" id="e_${id}" role="alert"></p></div>`;
 return `<h1 style="margin-top:1.5rem">${L("post_h")}</h1><p class="lead meta">${L("post_p")}</p><form id="pf" novalidate style="max-width:640px">
 ${f("type",L("l_type"),`<select id="type" required>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>`)}
 ${f("title",L("l_title"),`<input id="title" required maxlength="80">`)}
 ${f("desc",L("l_desc"),`<textarea id="desc" required maxlength="300"></textarea>`)}
 ${f("host",L("l_host"),`<input id="host" maxlength="60">`)}
 <div class="two">${f("date",L("l_date"),`<input id="date" type="date" required min="${today()}">`)}${f("start",L("l_start"),`<input id="start" type="time" required>`)}${f("end",L("l_end"),`<input id="end" type="time">`)}</div>
 ${f("town",L("l_town"),`<input id="town" list="towns" autocomplete="off" required><datalist id="towns">${Object.keys(TOWNS).map(t=>`<option value="${esc(t)}">`).join("")}</datalist>`,"Pick from the list. A draggable map pin comes with the Leaflet step.")}
 ${f("dir",L("l_dir"),`<textarea id="dir" maxlength="250"></textarea>`,L("l_dir_h"))}
 ${f("phone",L("l_phone"),`<input id="phone" type="tel" inputmode="tel" placeholder="082 000 0000" required>`)}
 ${f("photos",L("l_photos"),`<input id="photos" type="file" accept="image/*" multiple>`)}
 <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
 <div class="field"><label class="check"><input type="checkbox" id="consent"><span>${L("l_consent")}</span></label><p class="err" id="e_consent" role="alert"></p></div>
 <button class="btn pri" type="submit">${L("publish")}</button></form>`}

// ---------- Router ----------
function render(){
 const h=location.hash.slice(1)||"home",[r,id]=h.split("/"),app=document.getElementById("app");
 app.innerHTML=r==="events"?events():r==="post"?post():r==="gallery"?gallery():r==="event"?detail(id):home();
 document.querySelectorAll("nav a").forEach(a=>a.getAttribute("aria-current")&&a.removeAttribute("aria-current"));
 document.querySelectorAll(`nav a[data-r="${r==="event"?"events":r}"]`).forEach(c=>c.setAttribute("aria-current","page"));
 bind(r)}
function bind(r){
 const bs=document.getElementById("banset");if(bs)bs.onclick=()=>openGate();const nb=document.getElementById("nearbtn");if(nb)nb.onclick=locate;bindTown();
 const sf=document.getElementById("sf");if(sf)sf.onsubmit=e=>{e.preventDefault();location.hash="events"};
 ["ft:type","fp:prov","fd:dist"].forEach(s=>{const[i,k]=s.split(":"),el=document.getElementById(i);if(el)el.onchange=()=>{st[k]=el.value;render()}});
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;render()});
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{st.view=b.dataset.view;render()});
 const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(location.href);toast(L("copied"))}catch(e){}};
 const pf=document.getElementById("pf");if(pf)pf.onsubmit=submit;
}
async function submit(ev){
 ev.preventDefault();const v=id=>document.getElementById(id),err=(id,m)=>{const x=document.getElementById("e_"+id);if(x)x.textContent=m||""};
 let ok=true;["title","desc","date","start","phone"].forEach(i=>{const bad=!v(i).value.trim();err(i,bad?L("need"):"");if(bad)ok=false});
 const t=TOWNS[v("town").value.trim()];err("town",t?"":L("need_town"));if(!t)ok=false;
 err("consent",v("consent").checked?"":L("need_consent"));if(!v("consent").checked)ok=false;
 err("photos",v("photos").files.length>3?L("max3"):"");if(v("photos").files.length>3)ok=false;
 if(v("website").value)return;
 if(!ok){const first=document.querySelector(".err:not(:empty)");if(first)first.scrollIntoView({block:"center"});return}
 const e={id:"u"+Date.now(),type:v("type").value,title:v("title").value.trim(),host:v("host").value.trim(),date:v("date").value,start:v("start").value,end:v("end").value,town:v("town").value.trim(),lat:t[0],lng:t[1],prov:t[2],desc:v("desc").value.trim(),dir:v("dir").value.trim(),phone:v("phone").value};
 if(window.sb){const{data,error}=await window.sb.from("events").insert(toRow(e)).select().single();if(error){toast("Couldn’t publish your event. Please try again.");return}e.id=data.id}EVENTS.unshift(e);
 toast(L("posted"));location.hash="event/"+e.id}

const POSTAL={"7646":"Paarl","5600":"Qonce","5099":"Mthatha","2000":"Johannesburg","4001":"Durban","7784":"Khayelitsha"};
const GAL=[["cooking","Preparing food for the gathering"],["blankets","A blanketed procession in the hills"],["ceremony","Hosting in traditional attire"],["decor","Event décor with woven baskets"]];
const galGrid=n=>`<div class="gal2">${GAL.slice(0,n).map(g=>`<figure>${pic(g[0],g[1],"(min-width:800px) 25vw, 50vw")}<figcaption>${g[1]}</figcaption></figure>`).join("")}</div>`;
const gallery=()=>`<h1 style="margin-top:24px">Gallery</h1><p class="lead meta">Photographs from ceremonies, attire and community. Captions and credits are added by KwaXhosa.</p>${galGrid(4)}`;
function findPlace(q){q=q.trim().toLowerCase();if(!q)return null;if(POSTAL[q])return POSTAL[q];const k=Object.keys(TOWNS);return k.find(x=>x.toLowerCase()===q)||k.find(x=>x.toLowerCase().startsWith(q))||k.find(x=>x.toLowerCase().includes(q))||null}
function updLoc(){const n=st.locName;document.getElementById("loct").textContent=n?"Near "+n+(TOWNS[n]?", "+TOWNS[n][2]:""):"Set location"}
function setLoc(n,la,lo){st.loc=[la,lo];st.locName=n;st.locState="ok";try{localStorage.setItem("kx_loc",JSON.stringify({n,lat:la,lng:lo}))}catch(e){}closeGate();updLoc();render()}
function closeGate(){document.getElementById("gate").hidden=true}
function openGate(msg){const g=document.getElementById("gate"),opts=Object.keys(TOWNS).map(t=>`<option value="${esc(t)}">`).join("")+Object.entries(POSTAL).map(([k,v])=>`<option value="${k}" label="${v}">`).join("");
g.innerHTML=`<div class="in">${lockup()}<h1 id="gt" style="margin-top:16px">Where are you?</h1><p class="lead meta">Imicimbi near you come first. Tell us where you are and we’ll sort every event by distance.</p><div class="opts"><section class="opt"><h2>Use my current location</h2><p class="meta">We use your location to show events and stockists near you. We never share it.</p><button class="btn pri" id="g_geo">Use my current location</button>${msg?`<p class="err" role="alert">${msg}</p>`:""}</section><section class="opt"><h2>Enter a location</h2><div><label for="g_q">Town, suburb or postal code</label><input id="g_q" list="gl" autocomplete="off" placeholder="Qonce, Mthatha, Paarl, 7646"><datalist id="gl">${opts}</datalist></div><button class="btn blue" id="g_set">Show events near here</button><p class="err" id="g_err" role="alert"></p></section></div><button class="skip" id="g_skip">Skip for now</button></div>`;
g.hidden=false;const $=i=>document.getElementById(i);
$("g_skip").onclick=()=>{try{localStorage.setItem("kx_skip","1")}catch(e){}closeGate();render()};
$("g_set").onclick=()=>{const p=findPlace($("g_q").value),t=p&&TOWNS[p];if(t)setLoc(p,t[0],t[1]);else $("g_err").textContent="We couldn’t find that place yet. Try a nearby town or a 4-digit postal code."};
$("g_q").onkeydown=e=>{if(e.key==="Enter")$("g_set").click()};
$("g_geo").onclick=()=>{if(!navigator.geolocation)return openGate("This device can’t share its location. Enter your town instead.");navigator.geolocation.getCurrentPosition(p=>setLoc("Your location",p.coords.latitude,p.coords.longitude),()=>{openGate("Location is off, so please enter your town or postal code instead.");document.getElementById("g_q").focus()},{timeout:10000,maximumAge:600000})};
$("g_geo").focus()}
try{const sv=JSON.parse(localStorage.getItem("kx_loc")||"null");if(sv){st.loc=[sv.lat,sv.lng];st.locName=sv.n;st.locState="ok"}}catch(e){}
window.sb=null;
try{if(window.KX_CONFIG&&KX_CONFIG.url&&window.supabase)window.sb=supabase.createClient(KX_CONFIG.url,KX_CONFIG.anonKey)}catch(e){}
const fromRow=r=>({id:r.id,type:r.type,title:r.title,host:r.host_name||"",date:r.event_date,start:String(r.start_time).slice(0,5),end:r.end_time?String(r.end_time).slice(0,5):"",town:r.town,lat:r.lat,lng:r.lng,prov:r.province||"",desc:r.description,dir:r.directions||"",phone:r.phone});
const toRow=e=>({type:e.type,title:e.title,host_name:e.host||null,event_date:e.date,start_time:e.start,end_time:e.end||null,town:e.town,province:e.prov,lat:e.lat,lng:e.lng,description:e.desc,directions:e.dir||null,phone:e.phone,consent:true});
async function loadDb(){if(!window.sb)return;try{const{data,error}=await window.sb.from("events").select("*").eq("status","live");if(!error&&data){EVENTS=data.map(fromRow);render()}}catch(e){}}
document.getElementById("mini").innerHTML=emblem(36);document.getElementById("locbtn").onclick=()=>openGate();
document.querySelectorAll("[data-t]").forEach(n=>n.textContent=L(n.dataset.t));
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
render();updLoc();loadDb();
let sk=false;try{sk=localStorage.getItem("kx_skip")}catch(e){}
if(!st.loc&&!sk)openGate();
addEventListener("offline",()=>toast("You’re offline. Pages you have already opened are still available."));
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
<script src="kx2.js"></script>
</body>
</html>
